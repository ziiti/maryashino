<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маряшино — Уроки с Зити</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #D36B9A; --primary-light: #F4A6C1; --bg: #FFF0F5;
            --card: #FFFFFF; --text: #4A2C3A; --text-light: #8A6373;
            --heart: #FF6B9D; --success: #7BC89C; --warning: #F0A080;
            --border: #F5D6E0; --shadow: rgba(211,107,154,.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'Comic Sans MS', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); background-image: radial-gradient(#F4A6C1 1px, transparent 1px); background-size: 24px 24px; color: var(--text); min-height: 100vh; padding-bottom: 90px; overflow-x: hidden; }
        
        header { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 2px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; color: var(--primary); }
        .stats { display: flex; gap: 8px; align-items: center; font-weight: bold; font-size: 14px; }
        .badge { background: #FFF0F6; border: 2px solid var(--primary-light); padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); border-radius: 24px; padding: 24px; box-shadow: 0 8px 20px var(--shadow); border: 2px solid var(--border); margin-bottom: 20px; }
        
        .btn { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; border: none; padding: 14px 20px; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.1s; width: 100%; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
        .btn-secondary { background: #FFF0F6; color: var(--primary); border: 2px solid var(--primary-light); box-shadow: 0 4px 0 var(--primary-light); }
        .btn-warning { background: var(--warning); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .bar-bg { background: #EDF2F7; height: 12px; border-radius: 8px; overflow: hidden; margin-top: 4px;}
        .bar-fill { height: 100%; transition: width 0.3s; border-radius: 8px; }
        .fill-hunger { background: #FFB347; }
        .fill-mood { background: var(--heart); }
        .fill-energy { background: #4FACFE; }
        .stat-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; color: var(--text-light); margin-bottom: 4px; }

        #game-area { position: relative; height: 300px; background: #E0F7FA; border-radius: 20px; overflow: hidden; display: none; touch-action: none; border: 2px dashed var(--primary-light); }
        #basket { position: absolute; bottom: 0; font-size: 40px; transition: left 0.1s; transform: translateX(-50%); }
        .apple { position: absolute; font-size: 30px; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 2px solid var(--border); display: flex; justify-content: space-around; padding: 8px; z-index: 50; }
        .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: bold; color: var(--text-light); cursor: pointer; padding: 8px; border-radius: 12px; transition: 0.2s; }
        .nav-btn.active { color: var(--primary); background: #FFF0F6; }
        .nav-btn span { font-size: 20px; margin-bottom: 2px; }

        #pet-container {
            position: fixed; bottom: 80px; left: 50px;
            width: 140px; height: 180px; z-index: 40;
            pointer-events: none; transition: opacity 0.35s, transform 0.1s;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15));
            transform-origin: bottom center;
        }
        body.hover-ui #pet-container { opacity: 0.15 !important; }
        #pet-svg-wrapper svg { width: 100%; height: 100%; overflow: visible; }
        
        .zzz { position: absolute; top: -20px; right: 0; font-size: 24px; font-weight: bold; color: #4FACFE; animation: floatZ 2s infinite; display: none; }
        @keyframes floatZ { 0% { opacity: 0; transform: translateY(0); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
    </style>
</head>
<body>

<header>
    <div class="logo">🐾 Маряшино</div>
    <div class="stats">
        <div class="badge">💖 <span id="hearts">50</span></div>
    </div>
</header>

<div class="container">
    <div id="tab-ziti" class="tab-content active">
        <div class="card" style="text-align: center;">
            <h2 style="color: var(--primary); margin-bottom: 10px;">Привет, я Зити! 👋</h2>
            <p style="color: var(--text-light); font-size: 15px; margin-bottom: 20px;">Твой питомец гуляет по экрану. Решай задачи, чтобы заработать сердечки и покупать ему вкусности!</p>
            <button class="btn" onclick="switchTab('lessons')">Начать урок 🚀</button>
        </div>
    </div>

    <div id="tab-lessons" class="tab-content">
        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; font-size: 14px; color: var(--primary);">
                <span id="task-type">Загрузка...</span>
                <span id="task-progress">1/5</span>
            </div>
            <div class="bar-bg" style="margin-bottom: 20px;"><div class="bar-fill fill-mood" id="lesson-bar" style="width: 0%;"></div></div>
            <div style="background: #FFF0F6; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px;">
                <p id="task-q" style="font-size: 18px; font-weight: bold;">Загрузка задачи...</p>
            </div>
            <div id="answer-area"></div>
            <p id="ziti-hint" style="text-align: center; font-size: 14px; color: var(--text-light); margin-top: 15px; font-style: italic;"></p>
        </div>
    </div>

    <div id="tab-games" class="tab-content">
        <div class="card">
            <h2 style="color: var(--primary); margin-bottom: 10px; text-align: center;">🍎 Поймай яблочко</h2>
            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px;">
                <span>Счёт: <span id="score">0</span>/10</span>
                <button class="btn btn-secondary" style="width: auto; padding: 6px 15px;" onclick="startGame()">Играть</button>
            </div>
            <div id="game-area"><div id="basket">🧺</div></div>
        </div>
    </div>

    <div id="tab-pet" class="tab-content">
        <div class="card">
            <h2 style="color: var(--primary); margin-bottom: 20px; text-align: center;">🐾 Мой друг</h2>
            <div class="stat-label"><span>Сытость 🍎</span><span id="val-hunger">100%</span></div>
            <div class="bar-bg"><div class="bar-fill fill-hunger" id="bar-hunger" style="width:100%"></div></div>
            <div class="stat-label" style="margin-top: 10px;"><span>Настроение ⚽</span><span id="val-mood">100%</span></div>
            <div class="bar-bg"><div class="bar-fill fill-mood" id="bar-mood" style="width:100%"></div></div>
            <div class="stat-label" style="margin-top: 10px;"><span>Энергия ⚡</span><span id="val-energy">100%</span></div>
            <div class="bar-bg"><div class="bar-fill fill-energy" id="bar-energy" style="width:100%"></div></div>
            <div class="grid-2" style="margin-top: 20px;">
                <button class="btn" onclick="feedPet()">Покормить</button>
                <button class="btn btn-secondary" onclick="playPet()">Поиграть</button>
                <button class="btn btn-secondary" onclick="callPet()">Позвать</button>
                <button class="btn btn-secondary" onclick="freezePet()" id="btn-freeze">Не отвлекай</button>
                <button class="btn btn-warning" style="grid-column: span 2;" onclick="sleepPet()" id="btn-sleep">Уложить спать 😴</button>
            </div>
        </div>
    </div>

    <div id="tab-parents" class="tab-content">
        <div class="card" style="text-align: center;">
            <h2 style="margin-bottom: 15px;">🔒 Родителям</h2>
            <input type="password" id="pin" placeholder="PIN (1234)" style="width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); margin-bottom: 15px; text-align: center; font-size: 18px;">
            <button class="btn" onclick="authParent()">Войти</button>
            <div id="parent-stats" style="display: none; margin-top: 20px; text-align: left;">
                <p><strong>Решено задач:</strong> <span id="stat-solved">0</span></p>
                <button class="btn btn-warning" style="margin-top: 20px;" onclick="resetProgress()">Сбросить прогресс</button>
            </div>
        </div>
    </div>
</div>

<nav>
    <button class="nav-btn active" onclick="switchTab('ziti')" id="nav-ziti"><span>🐱</span>Зити</button>
    <button class="nav-btn" onclick="switchTab('lessons')" id="nav-lessons"><span>📖</span>Уроки</button>
    <button class="nav-btn" onclick="switchTab('games')" id="nav-games"><span>🎮</span>Игры</button>
    <button class="nav-btn" onclick="switchTab('pet')" id="nav-pet"><span>🐾</span>Питомец</button>
    <button class="nav-btn" onclick="switchTab('parents')" id="nav-parents"><span>🔒</span>Родителям</button>
</nav>

<div id="pet-container">
    <div class="zzz" id="zzz-text">Zzz</div>
    <div id="pet-svg-wrapper"></div>
</div><script>
// --- СОСТОЯНИЕ ---
let state = {
    hearts: 50, solved: 0, lessonTask: 0,
    pet: { hunger: 100, mood: 100, energy: 100, isSleeping: false, ignore: false, mouth: null }
};
let manifest = null;
let petX = 50, dir = 1, petState = 'idle', animTime = 0;

// --- UI И НАВИГАЦИЯ ---
function updateUI() {
    document.getElementById('hearts').innerText = state.hearts;
    document.getElementById('val-hunger').innerText = Math.round(state.pet.hunger) + '%';
    document.getElementById('bar-hunger').style.width = state.pet.hunger + '%';
    document.getElementById('val-mood').innerText = Math.round(state.pet.mood) + '%';
    document.getElementById('bar-mood').style.width = state.pet.mood + '%';
    document.getElementById('val-energy').innerText = Math.round(state.pet.energy) + '%';
    document.getElementById('bar-energy').style.width = state.pet.energy + '%';

    document.getElementById('btn-freeze').innerText = state.pet.ignore ? 'Можно играть' : 'Не отвлекай';
    document.getElementById('btn-sleep').innerText = state.pet.isSleeping ? 'Разбудить ☀️' : 'Спать 😴';
    document.getElementById('zzz-text').style.display = state.pet.isSleeping ? 'block' : 'none';
}

function switchTab(id) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${id}`).classList.add('active');
    document.getElementById(`nav-${id}`).classList.add('active');
    if(id === 'lessons') loadTask();
}

// --- СБОРКА ПИТОМЦА ---
async function initPet() {
    try {
        const res = await fetch('./manifest.json');
        manifest = await res.json();
        buildPetDOM();
        startPetLoop();
    } catch(e) { console.error("Ошибка манифеста", e); }
}

function createImg(id) {
    const p = manifest.parts.find(x => x.id === id);
    if(!p) return '';
    return `<image href="${p.file}" x="${-p.pivot[0]}" y="${-p.pivot[1]}" width="${p.size[0]}" height="${p.size[1]}" />`;
}

function buildPetDOM() {
    const wrapper = document.getElementById('pet-svg-wrapper');
    let mouth = state.pet.mouth ? state.pet.mouth : (state.pet.hunger < 30 ? "15_mouth_sad" : "13_mouth_smile");
    let eyes = state.pet.isSleeping ? createImg("07_lid_left") + createImg("08_lid_right") : createImg("03_eye_left") + createImg("04_eye_right") + createImg("05_pupil_left") + createImg("06_pupil_right");

    wrapper.innerHTML = `
    <svg viewBox="0 0 400 520">
        <g transform="translate(200, 345)">${createImg("19_backpack")}</g>
        <g id="leg-l" style="transform-origin: 176px 408px;"><g transform="translate(176, 408)">${createImg("26_thigh_left")}<g transform="translate(0, 36)">${createImg("27_shin_left")}</g><g transform="translate(0, 72)">${createImg("28_foot_left")}</g></g></g>
        <g id="leg-r" style="transform-origin: 224px 408px;"><g transform="translate(224, 408)">${createImg("29_thigh_right")}<g transform="translate(0, 36)">${createImg("30_shin_right")}</g><g transform="translate(0, 72)">${createImg("31_foot_right")}</g></g></g>
        <g transform="translate(200, 330)">${createImg("17_body")}</g>
        <g transform="translate(200, 330)">${createImg("18_vest")}</g>
        <g id="arm-l" style="transform-origin: 142px 296px;"><g transform="translate(142, 296)">${createImg("20_shoulder_left")}<g transform="translate(0, 36)">${createImg("21_forearm_left")}</g><g transform="translate(0, 70)">${createImg("22_hand_left")}</g></g></g>
        <g id="arm-r" style="transform-origin: 258px 296px;"><g transform="translate(258, 296)">${createImg("23_shoulder_right")}<g transform="translate(0, 36)">${createImg("24_forearm_right")}</g><g transform="translate(0, 70)">${createImg("25_hand_right")}</g></g></g>
        <g transform="translate(200, 170)">${createImg("01_head")}</g>
        <g transform="translate(200, 160)">${createImg("09_headphones")}</g>
        <g transform="translate(200, 96)">${createImg("02_hair")}</g>
        <g transform="translate(162, 168)">${eyes.split('</image>')[0]}</g>
        <g transform="translate(238, 168)">${eyes.split('</image>')[1] || ''}</g>
        <g transform="translate(200, 208)">${createImg(mouth)}</g>
    </svg>`;
}
</script><script>
// --- ДВИЖОК ЖИЗНИ (FSM) ---
function startPetLoop() {
    const container = document.getElementById('pet-container');
    const legL = document.getElementById('leg-l');
    const legR = document.getElementById('leg-r');
    const armL = document.getElementById('arm-l');
    const armR = document.getElementById('arm-r');

    setInterval(() => {
        if(state.pet.isSleeping || state.pet.ignore) { petState = 'idle'; return; }
        if(Math.random() < 0.6) petState = 'walking';
        else petState = 'idle';
        if(petState === 'walking') dir = Math.random() > 0.5 ? 1 : -1;
    }, 3000);

    function loop() {
        animTime += 0.1;
        container.style.transform = `translateX(${petX}px) scaleX(${dir})`;
        
        if(petState === 'walking' && !state.pet.ignore && !state.pet.isSleeping) {
            petX += dir * 2;
            if(petX > window.innerWidth - 150) { petX = window.innerWidth - 150; dir = -1; }
            if(petX < 10) { petX = 10; dir = 1; }
            
            const swing = Math.sin(animTime * 8) * 20;
            legL.style.transform = `rotate(${swing}deg)`;
            legR.style.transform = `rotate(${-swing}deg)`;
            armL.style.transform = `rotate(${-swing}deg)`;
            armR.style.transform = `rotate(${swing}deg)`;
        } else {
            legL.style.transform = `rotate(0deg)`; legR.style.transform = `rotate(0deg)`;
            armL.style.transform = `rotate(0deg)`; armR.style.transform = `rotate(0deg)`;
        }
        requestAnimationFrame(loop);
    }
    loop();
}

// --- ДЕЙСТВИЯ С ПИТОМЦЕМ ---
function feedPet() {
    if(state.hearts < 10) return alert('Нужно больше сердечек!');
    if(state.pet.isSleeping) return alert('Питомец спит.');
    state.hearts -= 10;
    state.pet.hunger = Math.min(100, state.pet.hunger + 30);
    state.pet.mouth = '14_mouth_open';
    updateUI(); buildPetDOM();
    setTimeout(() => { state.pet.mouth = null; buildPetDOM(); }, 1000);
}

function playPet() {
    if(state.hearts < 5) return alert('Нужно больше сердечек!');
    if(state.pet.energy < 15) return alert('Питомец устал.');
    state.hearts -= 5;
    state.pet.mood = Math.min(100, state.pet.mood + 20);
    state.pet.energy = Math.max(0, state.pet.energy - 15);
    updateUI();
}

function callPet() {
    if(state.pet.isSleeping) return alert('Питомец спит.');
    petX = window.innerWidth / 2 - 70;
    petState = 'idle';
}

function freezePet() {
    state.pet.ignore = !state.pet.ignore;
    updateUI();
}

function sleepPet() {
    state.pet.isSleeping = !state.pet.isSleeping;
    if(state.pet.isSleeping) {
        let sleepInt = setInterval(() => {
            state.pet.energy = Math.min(100, state.pet.energy + 10);
            updateUI();
            if(!state.pet.isSleeping || state.pet.energy >= 100) clearInterval(sleepInt);
        }, 3000);
    }
    updateUI(); buildPetDOM();
}

// --- ИГРА "ПОЙМАЙ ЯБЛОЧКО" ---
let isPlaying = false, score = 0, basketPos = 50;
function startGame() {
    if(state.pet.energy < 15) return alert('Питомец устал!');
    state.pet.energy -= 15; updateUI();
    isPlaying = true; score = 0;
    document.getElementById('score').innerText = score;
    document.getElementById('game-area').style.display = 'block';
    
    const area = document.getElementById('game-area');
    const basket = document.getElementById('basket');
    
    area.onmousemove = (e) => { basketPos = e.clientX - area.getBoundingClientRect().left; basket.style.left = basketPos + 'px'; };
    area.ontouchmove = (e) => { basketPos = e.touches[0].clientX - area.getBoundingClientRect().left; basket.style.left = basketPos + 'px'; };

    let appleLoop = setInterval(() => {
        if(!isPlaying) { clearInterval(appleLoop); return; }
        const apple = document.createElement('div');
        apple.className = 'apple'; apple.innerText = '🍎';
        const x = Math.random() * (area.clientWidth - 30);
        apple.style.left = x + 'px'; apple.style.top = '-30px';
        area.appendChild(apple);
        
        let y = -30;
        const fall = setInterval(() => {
            y += 6; apple.style.top = y + 'px';
            if(y > area.clientHeight - 50) {
                clearInterval(fall);
                if(Math.abs(x + 15 - basketPos) < 40) {
                    score++; document.getElementById('score').innerText = score;
                    if(score >= 10) endGame();
                }
                apple.remove();
            }
        }, 30);
    }, 800);
}

function endGame() {
    isPlaying = false;
    document.getElementById('game-area').style.display = 'none';
    state.hearts += 5;
    state.pet.mood = Math.min(100, state.pet.mood + 10);
    updateUI();
    alert('Молодец! +5 сердечек!');
}
</script><script>
// --- БАЗА ЗАДАЧ ---
const TASKS = [
    { type: 'Арифметика', q: 'У Маряшины было 8 конфет. Она отдала 3. Сколько осталось?', a: '5' },
    { type: 'Логика', q: 'Все коты мяукают. Мурка — кот. Что делает Мурка? (Напиши "мяукает")', a: 'мяукает' },
    { type: 'IQ', q: 'Продолжи ряд: 2, 4, 6, 8, ... Какое следующее число?', a: '10' },
    { type: 'Внимание', q: 'Найди лишнее: яблоко, груша, морковь, банан.', a: 'морковь' },
    { type: 'Логика', q: 'Что тяжелее: 1 кг ваты или 1 кг железа? (Напиши "одинаково")', a: 'одинаково' }
];

function loadTask() {
    if(state.lessonTask >= 5) { 
        alert('Урок пройден! +20 сердечек'); 
        state.hearts += 20; state.lessonTask = 0; updateUI(); 
    }
    const task = TASKS[state.lessonTask];
    
    document.getElementById('task-type').innerText = task.type;
    document.getElementById('task-q').innerText = task.q;
    document.getElementById('task-progress').innerText = `${state.lessonTask + 1}/5`;
    document.getElementById('lesson-bar').style.width = `${(state.lessonTask/5)*100}%`;
    document.getElementById('ziti-hint').innerText = '';
    
    document.getElementById('answer-area').innerHTML = `
        <input type="text" id="ans" placeholder="Твой ответ..." style="width:100%; padding:12px; border-radius:12px; border:2px solid var(--border); font-size:16px; margin-bottom:10px; text-align:center;">
        <button class="btn" onclick="checkAns()">Отправить</button>
    `;
}

function checkAns() {
    const task = TASKS[state.lessonTask];
    const val = document.getElementById('ans').value.trim().toLowerCase();
    if(val === task.a.toLowerCase()) {
        state.hearts += 10; state.solved++; state.lessonTask++;
        updateUI();
        if(window.confetti) confetti({ particleCount: 50, spread: 60 });
        loadTask();
    } else {
        document.getElementById('ziti-hint').innerText = "Попробуй еще раз, у тебя получится!";
    }
}

// --- РОДИТЕЛЯМ ---
function authParent() {
    if(document.getElementById('pin').value === '1234') {
        document.getElementById('parent-stats').style.display = 'block';
        document.getElementById('stat-solved').innerText = state.solved;
    } else alert('Неверный PIN');
}

function resetProgress() {
    if(confirm('Сбросить всё?')) { location.reload(); }
}

// --- ЭФФЕКТ ПРИЗРАКА ---
document.addEventListener('mouseover', e => {
    if(e.target.closest('button, input, .nav-btn')) document.body.classList.add('hover-ui');
});
document.addEventListener('mouseout', e => {
    if(e.target.closest('button, input, .nav-btn')) document.body.classList.remove('hover-ui');
});

// --- СТАРТ ---
window.onload = () => {
    initPet();
    updateUI();
};
</script>
</body>
</html>
